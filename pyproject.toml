[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cst-studio-mcp"
version = "1.1.0"
description = "Clean, Python-first MCP server for CST Studio Suite 2024–2026"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/AGPL-3.0-or-later.txt", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "RFingAdam" }, { name = "Ismail Akdag" }]
maintainers = [{ name = "Ismail Akdag" }]
keywords = ["mcp", "cst", "antenna", "rf", "simulation", "electromagnetic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "anyio>=4.5",
    "jsonschema>=4.20",
    "mcp>=1.29,<3",
]

[project.urls]
Repository = "https://github.com/ismailakdag/cst-studio-mcp"
Upstream = "https://github.com/RFingAdam/mcp-cst-studio"
Issues = "https://github.com/ismailakdag/cst-studio-mcp/issues"

[project.optional-dependencies]
figures = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.scripts]
cst-studio-mcp = "cst_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cst_mcp"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/cst_mcp", "README.md", "pyproject.toml",
    "LICENSE", "LICENSES/AGPL-3.0-or-later.txt", "NOTICE",
    "tests", "scripts/build_docs.py", "scripts/README.md", "docs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
