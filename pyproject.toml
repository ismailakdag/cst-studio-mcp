[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cst-studio-mcp"
version = "1.0.0"
description = "Clean, Python-first MCP server for CST Studio Suite 2024–2026"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "cst-studio-mcp" }]
keywords = ["mcp", "cst", "antenna", "rf", "simulation", "electromagnetic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.scripts]
cst-studio-mcp = "cst_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cst_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/cst_mcp", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
