name: Test MCP compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mcp: ['1.29.0', '2.2.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,figures]' 'mcp==${{ matrix.mcp }}'
      - run: python -m pytest -q
      - run: python scripts/build_docs.py
